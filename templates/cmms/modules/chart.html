<div class="data-chart" aria-label="{{ chart_title }}"><h3 class="section-title mb-3">{{ chart_title|capfirst }}</h3>{% for point in chart_rows %}<div class="chart-row" data-value="{{ point.value|default:0 }}"><span>{{ point.label }}</span><div class="chart-track"><span></span></div><strong>{{ point.value }}</strong></div>{% empty %}<div class="empty-state">No hay datos para esta consulta.</div>{% endfor %}</div>
