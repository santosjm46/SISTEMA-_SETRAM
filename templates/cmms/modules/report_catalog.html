{% if catalog %}<div class="page-heading"><div><h2>Catálogo de informes</h2><p>Consulta el período y genera CSV o PDF con datos de tu organización.</p></div><div class="heading-actions"><a class="btn btn-outline-primary" href="{% url 'report-zip' %}">Descargar todos · ZIP</a><a class="btn btn-primary" href="{% url 'list' 'reportes_programados' %}">Programar informes</a></div></div><div class="row g-3 mb-4">{% for report in catalog %}<div class="col-md-6 col-xl-4"><section class="panel panel-body h-100"><h3 class="section-title mb-3">{{ report.title }}</h3><a class="btn btn-outline-primary" href="{% url 'report-detail' report.key %}">Consultar y generar →</a></section></div>{% endfor %}</div>{% endif %}
